name = "goldenturn-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[vars]
SESSION_TTL_DAYS = "30"
# Comma separated. The second is a machine account used to exercise the admin
# endpoints; its password lives in .env and nowhere in the repo.
ADMIN_EMAIL = "prabhune@berkeley.edu,admincli@goldenturn.org"
ALLOWED_ORIGINS = "https://goldenturn.org,http://localhost:4321,http://localhost:4400"
# Where an edit asks for a rebuild. The token that authorises it is a secret.
GITHUB_REPO = "tejasprabhune/goldenturn"

[[d1_databases]]
binding = "DB"
database_name = "goldenturn"
database_id = "0baf36dd-91c8-42e3-9818-582e82b7f560"

# Removing a round has to take its audio, transcript and timings with it, or
# the files stay served at a guessable address after the round is gone.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "goldenturn-media"
