name: onboard submitted rounds

# Runs itself so a submitted round becomes a complete one without anybody
# doing anything. Each step works out its own outstanding work from what is in
# the bucket, so a run that finds nothing costs a minute and a run that finds
# half-finished work finishes it.
#
# It deploys the site itself when something changed, rather than asking the
# deploy workflow to run: a workflow cannot trigger another with the built-in
# token, and a round has no page until the site is rebuilt.
#
# It has no schedule of its own any more. GitHub switches off a scheduled
# workflow once its repository has gone sixty days without activity, and a
# schedule firing is not activity: the last commit was on 28 August, the last
# run on 27 October, and the rounds submitted after that sat without pages
# while nothing anywhere said so. A workflow with no schedule is not subject
# to that, so the clock lives in the API instead: the Worker has a cron
# trigger (worker/wrangler.toml) and sends this event every fifteen minutes.
# It is also on time, which GitHub's own schedule was not under load.
#
# Do not add a `schedule:` back as a fallback. It is the schedule that makes
# the workflow eligible to be disabled, and a disabled workflow ignores the
# Worker's event as well.
on:
  repository_dispatch:
    types: [onboard-due]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Shares the deploy workflow's group: two Pages deployments at once fail.
  group: pages
  cancel-in-progress: false

jobs:
  onboard:
    runs-on: ubuntu-latest
    # A backstop. Each step in auto.ts has a limit of its own and every link
    # has a time and size limit in drain-submissions.ts, so a run normally
    # ends long before this. Without any, one link that answered and then
    # sent nothing held the run, and the pages group with it, for six hours,
    # and the next run did the same.
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.run.outputs.changed }}
      built: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ffmpeg transcodes and measures; yt-dlp is the path for YouTube and
      # Vimeo submissions.
      - name: install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          pipx install yt-dlp

      - name: onboard
        id: run
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_S3_KEY: ${{ secrets.CLOUDFLARE_S3_KEY }}
          CLOUDFLARE_S3_SECRET: ${{ secrets.CLOUDFLARE_S3_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          GT_ADMIN_TOKEN: ${{ secrets.GT_ADMIN_TOKEN }}
          # The fitter asks the index what format each round is, because
          # fitting a policy round as parli would look for six speeches that
          # are not there. Without these it would quietly assume parli.
          PUBLIC_ALGOLIA_APP_ID: CS1MDMNJTO
          PUBLIC_ALGOLIA_SEARCH_KEY: ${{ secrets.ALGOLIA_SEARCH_KEY }}
          PUBLIC_ALGOLIA_INDEX_NAME: all_rounds
          # Writing a round's topic back to the index is part of onboarding it.
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
        run: pnpm exec tsx scripts/ingest/auto.ts

      # Only when a round actually changed: a rebuild every twenty minutes
      # would republish the whole site for nothing.
      #
      # Not only when the step above succeeded, though. It ends in error when
      # any one thing went wrong, so that somebody is told, and by then it may
      # have given three other rounds their audio; those still get their pages.
      - name: build
        id: build
        if: ${{ !cancelled() && steps.run.outputs.changed == 'true' }}
        env:
          PUBLIC_ALGOLIA_APP_ID: CS1MDMNJTO
          PUBLIC_ALGOLIA_SEARCH_KEY: ${{ secrets.ALGOLIA_SEARCH_KEY }}
          PUBLIC_ALGOLIA_INDEX_NAME: all_rounds
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
        run: pnpm run build

      - uses: actions/upload-pages-artifact@v3
        id: upload
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          path: ./dist

  deploy:
    needs: onboard
    # The onboard job is marked failed when its run step was, even with the
    # site built and uploaded after it, so this asks whether there is a site
    # to deploy rather than whether the job succeeded.
    if: ${{ !cancelled() && needs.onboard.outputs.built == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
