name: transcription logs

# What the Modal app has been doing, for when a round is waiting on a
# transcript and nothing says why. Run by hand. It can also ask the app to
# check the bucket now instead of at its next fifteen-minute turn.
on:
  workflow_dispatch:
    inputs:
      sweep:
        description: 'Check the bucket for work now'
        type: boolean
        default: false
      minutes:
        description: 'Minutes to wait before showing the logs'
        default: '5'

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet modal==1.6.4
      - name: check the bucket now
        if: ${{ inputs.sweep }}
        run: python -c "import modal; print(modal.Function.from_name('goldenturn-transcribe', 'sweep').remote())"
      # Fetched after the wait, since the logs command returns what there is
      # and leaves; the image build's own output is left out.
      - name: wait, then show the logs
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          sleep "$((MINUTES * 60))"
          modal app logs goldenturn-transcribe --since 3h --tail 4000 \
            | grep -v -E "Uninstall|uninstalled|Attempting|Found existing|Requirement already|Collecting|Downloading|━|^Get:|Unpacking|Selecting|Setting up|Preparing to" \
            | tail -n 300 || true
